<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Guitar Study</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh;
        }
        .register-card {
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        .fs-7 { font-size: 0.85rem !important; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container my-auto">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            
            <div class="text-center mb-4">
                <a href="{{ url_for('guitar_study.login') }}" class="d-inline-flex align-items-center justify-content-center bg-primary bg-gradient text-white rounded-circle mb-3 shadow text-decoration-none" style="width: 56px; height: 56px;">
                    <i class="bi bi-guitar fs-2"></i>
                </a>
                <h1 class="fw-bold text-primary mb-1">Crie sua Conta</h1>
                <p class="text-muted">Participe da melhor plataforma de estudos de música</p>
            </div>
            
            <!-- Mensagens Flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <div class="card register-card p-4 p-md-5">
                <form action="{{ url_for('guitar_study.register') }}" method="POST">
                    
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="name" class="form-label fw-medium">Nome Completo</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Seu nome" required autofocus>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label fw-medium">Nome de Usuário (Username)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-at text-muted"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Ex: joao_guitar" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-medium">E-mail</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Seu melhor e-mail" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="password" class="form-label fw-medium">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 dígitos" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="confirm_password" class="form-label fw-medium">Confirmar Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3 shadow">Concluir Cadastro</button>
                    
                    <div class="text-center">
                        <span class="text-muted fs-7">Já tem registro? <a href="{{ url_for('guitar_study.login') }}" class="text-decoration-none fw-semibold">Fazer Login</a></span>
                    </div>
                    
                </form>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
